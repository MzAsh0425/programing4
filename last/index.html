<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Final Project: Data Visualization</title>
<style>
  body { margin: 0; overflow: hidden; }
  /* コントロールパネルのスタイル */
  #ctrl-panel {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 200px;
    padding: 15px;
    background-color: rgba(255, 255, 255, 0.9);
    border: 2px solid #333;
    border-radius: 5px;
    font-family: sans-serif;
    z-index: 10; /* Canvasより手前に表示 */
  }
  h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
  label { display: block; margin: 5px 0; cursor: pointer; }
</style>
<script src="three.js"></script>
</head>
<body>

<div id="ctrl-panel">
  <h3>表示コントロール</h3>
  <form name="fm">
    <label>
      <input type="checkbox" name="chkBar" checked onchange="updateVisibility()"> 棒グラフ (Bar)
    </label>
    <label>
      <input type="checkbox" name="chkLine" onchange="updateVisibility()"> 折れ線グラフ (Line)
    </label>
  </form>
  <hr>
  <div style="font-size: small;">
    <p>マウスを左右に動かすと<br>視点が回転します。</p>
  </div>
</div>

<script>
// ■ 初期化処理 (これまでの講義の定型文)
  var scene = new THREE.Scene();
  // 視点操作をするため、カメラの初期位置はdraw関数内で上書きされます
  var camera = new THREE.PerspectiveCamera( 70, window.innerWidth/window.innerHeight, 0.1, 10000 );
  var renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild( renderer.domElement );
  
  // ライトの設定
  var light = new THREE.DirectionalLight(0xffffff);
  light.position.set(1, 1, 1);
  scene.add(light);
  var ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

// ■ データ定義 (12_12の気温データなどを想定)
  var data = [30, 80, 150, 120, 200, 180, 90, 50, 110, 160, 220, 140];
  var labels = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];

  var barWidth = 30;
  var gap = 20;
  var totalWidth = (barWidth + gap) * data.length;

// ■ グラフ用グループの作成 (オブジェクトをまとめて管理)
  var barGroup = new THREE.Group();
  scene.add(barGroup);
  
  var lineGroup = new THREE.Group();
  scene.add(lineGroup);
  // 初期状態では折れ線グラフは非表示にしておく
  lineGroup.visible = false;

// ■ 2. グラフの生成処理
  // 色を綺麗に見せるためのマテリアル
  var materialBar = new THREE.MeshNormalMaterial(); 
  var materialLine = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // 赤色
  var materialPoint = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // 黄色

  for (var i = 0; i < data.length; i++) {
    var val = data[i];
    // X座標の計算 (全体が中央に来るように調整)
    var x = (barWidth + gap) * i - totalWidth / 2;
    var y = val;

    // --- A. 棒グラフの作成 (01_08/EX1等と同様) ---
    var geoBar = new THREE.BoxGeometry(barWidth, val, barWidth);
    var meshBar = new THREE.Mesh(geoBar, materialBar);
    // 高さが中心から伸びるため、y/2 の位置に置く
    meshBar.position.set(x, y / 2, 0);
    barGroup.add(meshBar);

    // --- B. 折れ線グラフの作成 (工夫ポイント) ---
    // 1. データ点（プロット）としての球体
    var geoPoint = new THREE.SphereGeometry(10, 16, 16);
    var meshPoint = new THREE.Mesh(geoPoint, materialPoint);
    meshPoint.position.set(x, y, 0);
    lineGroup.add(meshPoint);

    // 2. 線をつなぐ (前の点がある場合のみ)
    if (i > 0) {
      var prevVal = data[i-1];
      var prevX = (barWidth + gap) * (i - 1) - totalWidth / 2;
      var prevY = prevVal;

      // 2点間の距離と角度を計算 (数学関数の応用)
      var dx = x - prevX;
      var dy = y - prevY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var angle = Math.atan2(dy, dx);

      // 線に見立てた細いBoxを作成
      var geoLine = new THREE.BoxGeometry(dist, 4, 4); // 長さdist, 太さ4
      var meshLine = new THREE.Mesh(geoLine, materialLine);
      
      // 2点の中点に配置
      meshLine.position.set((x + prevX)/2, (y + prevY)/2, 0);
      // 角度に合わせて回転 (Z軸回転)
      meshLine.rotation.z = angle;
      
      lineGroup.add(meshLine);
    }
  }

  // 地面 (グリッド代わりの板)
  var geoGround = new THREE.BoxGeometry(totalWidth + 100, 2, 400);
  var matGround = new THREE.MeshStandardMaterial({ color: 0xcccccc });
  var ground = new THREE.Mesh(geoGround, matGround);
  ground.position.set(-gap/2, -1, 0); // グラフの足元に合わせる
  scene.add(ground);

// ■ 3. マウスインタラクション (01_08/EX3の応用)
  var mouseX = 0;
  document.addEventListener("mousemove", (event) => {
    // 画面中央を0とした比率 (-1.0 ～ 1.0)
    mouseX = (event.pageX - window.innerWidth / 2) / (window.innerWidth / 2);
  });

// ■ 4. 表示切替関数 (コントロールパネルから呼ばれる)
  function updateVisibility() {
    // フォームのチェック状態を取得して visible プロパティに反映
    barGroup.visible = document.fm.chkBar.checked;
    lineGroup.visible = document.fm.chkLine.checked;
  }

// ■ 5. 描画ループ
  var rot = 0;
  function draw() {
    requestAnimationFrame( draw );

    // マウス位置に応じてカメラ位置を計算 (円周上を移動)
    // 01_08/EX3.htmlのロジックをベースに調整
    var targetRot = mouseX * Math.PI; // ±180度回転可能に
    // 滑らかに追従させる処理
    rot += (targetRot - rot) * 0.05;

    var distance = 600;
    var camX = Math.sin(rot) * distance;
    var camZ = Math.cos(rot) * distance;
    
    // カメラ位置更新
    camera.position.set(camX, 400, camZ);
    // 常にグラフの中心付近(0, 100, 0)を見る
    camera.lookAt(new THREE.Vector3(0, 100, 0));

    renderer.render( scene, camera );
  }
  draw();

  // ウィンドウリサイズ対応（おまけ）
  window.addEventListener('resize', function() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

</script>
</body>
</html>
