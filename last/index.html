<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Final Project: Weather Visualization</title>
<style>
  body { margin: 0; overflow: hidden; }
  /* コントロールパネルのスタイル */
  #ctrl-panel {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 240px;
    padding: 15px;
    background-color: rgba(255, 255, 255, 0.9);
    border: 2px solid #333;
    border-radius: 5px;
    font-family: sans-serif;
    z-index: 10;
  }
  h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
  label { display: block; margin: 5px 0; cursor: pointer; }
</style>
<script src="three.js"></script>
</head>
<body>

<div id="ctrl-panel">
  <h3>気象データ可視化 (彦根)</h3>
  <form name="fm">
    <label>
      <input type="checkbox" name="chkRain" checked onchange="updateVisibility()"> 降水量 (棒:水テクスチャ)
    </label>
    <label>
      <input type="checkbox" name="chkTemp" checked onchange="updateVisibility()"> 気温 (線:太陽テクスチャ)
    </label>
  </form>
  <hr>
  <div style="font-size: small;">
    <p>
      <b>マウス操作:</b><br>
      左右: 視点の回転<br>
      上下: 視点の高さ変更
    </p>
  </div>
</div>

<script>
// ■ 1. CSV読み込み関数 (12_12/hw1.html の模倣)
function getCSV( file ){
  var req = new XMLHttpRequest( );
  req.open("get", file, false); // 同期通信
  req.send();
  var tmp = req.responseText.split("\n");
  var result = new Array();
  for(var i=0;i<tmp.length;i++){
    result[i] = tmp[i].split(",");
  }
  return result;
}

// ■ 2. データの準備
var csvData = getCSV("data.csv");
var labels = [];
var dataTemp = [];
var dataRain = [];

for (var i = 2; i < csvData.length; i++) {
  var row = csvData[i];
  if (row.length < 5) continue;
  labels.push(row[0]);           // A列: 日付
  dataTemp.push(Number(row[1])); // B列: 月平均気温
  dataRain.push(Number(row[4])); // E列: 月合計降水量
}

// ■ 3. Three.js 初期化処理
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera( 70, window.innerWidth/window.innerHeight, 0.1, 10000 );
var renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild( renderer.domElement );

// ライト設定
var light = new THREE.DirectionalLight(0xffffff);
light.position.set(1, 1, 1);
scene.add(light);
var ambientLight = new THREE.AmbientLight(0xffffff, 0.7); // テクスチャが暗くならないよう少し明るめに
scene.add(ambientLight);

// グラフ用グループ
var rainGroup = new THREE.Group();
scene.add(rainGroup);
var tempGroup = new THREE.Group();
scene.add(tempGroup);

// ■ 4. テクスチャとマテリアルの準備 (01_08/EX4.htmlの応用)
// TextureLoaderを使って画像を読み込む
var loader = new THREE.TextureLoader();
var textureWater = loader.load('water.jpg');
var textureSun = loader.load('sun.jpg');

// テクスチャを適用したマテリアルを作成
var matRain = new THREE.MeshStandardMaterial({ map: textureWater });
var matTemp = new THREE.MeshStandardMaterial({ map: textureSun });


// ■ 5. グラフの生成
var barWidth = 20;
var gap = 15;
var totalWidth = (barWidth + gap) * dataRain.length;

for (var i = 0; i < dataRain.length; i++) {
  var x = (barWidth + gap) * i - totalWidth / 2;

  // --- 降水量 (棒グラフ) ---
  var hRain = dataRain[i];
  if (hRain > 0) {
    var geoBar = new THREE.BoxGeometry(barWidth, hRain, barWidth);
    var meshBar = new THREE.Mesh(geoBar, matRain);
    meshBar.position.set(x, hRain / 2, 0);
    rainGroup.add(meshBar);
  }

  // --- 気温 (折れ線グラフ) ---
  var tVal = dataTemp[i];
  var plotHeight = tVal * 5; // 5倍に拡大表示

  // プロット点 (太陽のテクスチャ)
  var geoPoint = new THREE.SphereGeometry(6, 16, 16);
  var meshPoint = new THREE.Mesh(geoPoint, matTemp);
  meshPoint.position.set(x, plotHeight, 0);
  tempGroup.add(meshPoint);

  // 線を引く (前回の点とつなぐ)
  if (i > 0) {
    var prevX = (barWidth + gap) * (i - 1) - totalWidth / 2;
    var prevTVal = dataTemp[i-1];
    var prevHeight = prevTVal * 5;

    var dx = x - prevX;
    var dy = plotHeight - prevHeight;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var angle = Math.atan2(dy, dx);

    // 線にも太陽のテクスチャを適用
    var geoLine = new THREE.BoxGeometry(dist, 4, 4);
    var meshLine = new THREE.Mesh(geoLine, matTemp);
    meshLine.position.set((x + prevX)/2, (plotHeight + prevHeight)/2, 0);
    meshLine.rotation.z = angle;
    tempGroup.add(meshLine);
  }
}

// ★ 変更点: 床のオブジェクト生成コードを削除しました ★
/*
var geoGround = new THREE.BoxGeometry(totalWidth + 200, 2, 400);
var matGround = new THREE.MeshStandardMaterial({ color: 0xcccccc });
var ground = new THREE.Mesh(geoGround, matGround);
ground.position.set(-gap/2, -1, 0);
scene.add(ground);
*/


// ■ 6. インタラクション
var mouseX = 0;
var mouseY = 0;
document.addEventListener("mousemove", (event) => {
  mouseX = event.pageX / window.innerWidth;
  mouseY = event.pageY / window.innerHeight;
});

// 表示切り替え関数
function updateVisibility() {
  rainGroup.visible = document.fm.chkRain.checked;
  tempGroup.visible = document.fm.chkTemp.checked;
}

// ■ 7. 描画ループ
function draw() {
  requestAnimationFrame( draw );

  var rot = mouseX * 2 * Math.PI;
  // マウスを一番上に持っていくとカメラが下がりすぎないよう範囲を調整
  var h = mouseY * 1200 - 200; 

  var distance = 600;
  camera.position.set(Math.sin(rot) * distance, h, Math.cos(rot) * distance);
  camera.lookAt(new THREE.Vector3(0, 100, 0));

  renderer.render( scene, camera );
}
draw();

// ウィンドウリサイズ対応
window.addEventListener('resize', function() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

</script>
</body>
</html>
