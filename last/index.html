<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Final Project: 3D Weather Graph</title>
<style>
  body { margin: 0; overflow: hidden; }
  #ctrl-panel {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 240px;
    padding: 15px;
    background-color: rgba(255, 255, 255, 0.9);
    border: 2px solid #333;
    border-radius: 5px;
    font-family: sans-serif;
    z-index: 10;
  }
  h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
  label { display: block; margin: 5px 0; cursor: pointer; }
</style>
<script src="three.js"></script>
  
// TextGeometry実装用（後述）
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

<div id="ctrl-panel">
  <h3>気象データ可視化 (彦根)</h3>
  <form name="fm">
    <label><input type="checkbox" name="chkRain" checked onchange="updateVisibility()"> 降水量 (棒:水)</label>
    <label><input type="checkbox" name="chkTemp" checked onchange="updateVisibility()"> 気温 (線:太陽)</label>
    <label><input type="checkbox" name="chkText" checked onchange="updateVisibility()"> ラベル・軸</label>
  </form>
  <hr>
</div>

<script>
function getCSV( file ){
  var req = new XMLHttpRequest();
  req.open("get", file, false);
  req.send();
  var tmp = req.responseText.split("\n");
  var result = [];
  for(var i=0;i<tmp.length;i++){
    result[i] = tmp[i].split(",");
  }
  return result;
}

var csvData = getCSV("data.csv");
var labels = [];
var dataTemp = [];
var dataRain = [];
for (var i = 2; i < csvData.length; i++) {
  var row = csvData[i];
  if (row.length < 5) continue;
  var dateStr = row[0];
  var month = dateStr.split("/")[1]; 
  
  labels.push(month);
  dataTemp.push(Number(row[1]));
  dataRain.push(Number(row[4]));
}

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera( 70, window.innerWidth/window.innerHeight, 0.1, 10000 );
var renderer = new THREE.WebGLRenderer({ antialias: true }); 
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild( renderer.domElement );

var light = new THREE.DirectionalLight(0xffffff);
light.position.set(1, 1, 1);
scene.add(light);
var ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

var rainGroup = new THREE.Group();
scene.add(rainGroup);
var tempGroup = new THREE.Group();
scene.add(tempGroup);
var textGroup = new THREE.Group();
scene.add(textGroup);

var loader = new THREE.TextureLoader();
var matRain = new THREE.MeshStandardMaterial({ map: loader.load('water.jpg') });
var matTemp = new THREE.MeshStandardMaterial({ map: loader.load('sun.jpg') });

var barWidth = 20;
var gap = 15;
var totalWidth = (barWidth + gap) * dataRain.length;

for (var i = 0; i < dataRain.length; i++) {
  var x = (barWidth + gap) * i - totalWidth / 2 + (barWidth/2);

  var hRain = dataRain[i];
  if (hRain > 0) {
    var meshBar = new THREE.Mesh(new THREE.BoxGeometry(barWidth, hRain, barWidth), matRain);
    meshBar.position.set(x, hRain / 2, 0);
    rainGroup.add(meshBar);
  }

  var tVal = dataTemp[i];
  var plotHeight = tVal * 7.5;
  
  var meshPoint = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 16), matTemp);
  meshPoint.position.set(x, plotHeight, 0);
  tempGroup.add(meshPoint);

  if (i > 0) {
    var prevX = (barWidth + gap) * (i - 1) - totalWidth / 2 + (barWidth/2);
    var prevH = dataTemp[i-1] * 7.5;
    var dx = x - prevX;
    var dy = plotHeight - prevH;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var angle = Math.atan2(dy, dx);
    var meshLine = new THREE.Mesh(new THREE.BoxGeometry(dist, 4, 4), matTemp);
    meshLine.position.set((x + prevX)/2, (plotHeight + prevH)/2, 0);
    meshLine.rotation.z = angle;
    tempGroup.add(meshLine);
  }
}

function createAxis() {
  var material = new THREE.LineBasicMaterial({ color: 0xffffff });
  var points = [];
  points.push( new THREE.Vector3( -totalWidth/2 - 20, 300, 0 ) );
  points.push( new THREE.Vector3( -totalWidth/2 - 20, 0, 0 ) );
  points.push( new THREE.Vector3( totalWidth/2 + 20, 0, 0 ) );
  points.push( new THREE.Vector3( totalWidth/2 + 20, 300, 0 ) );

  var geometry = new THREE.BufferGeometry().setFromPoints( points );
  var line = new THREE.Line( geometry, material );
  textGroup.add(line);
}
createAxis();

/* ★★★ 新規実装箇所：開始 ★★★
   第４回講義資料にあった、TextGepmetryを使用して文字を配置してみようと考えました。
   使用法を調べたところ、FontLoaderというものを要するそうなので、LLMを利用しながら実装してみました。
*/
// フォントローダーの初期化
var fontLoader = new THREE.FontLoader();

// 外部フォントデータの読み込み (非同期処理)
fontLoader.load('https://unpkg.com/three@0.128.0/examples/fonts/helvetiker_regular.typeface.json', function(font) {
  
  // 指定した文字列、座標、サイズで3Dテキストを作成する関数
  function addText(text, x, y, z, size, color) {
    var geometry = new THREE.TextGeometry(text, {
      font: font,
      size: size,
      height: 2, // 文字の厚み
      curveSegments: 12,
    });
    var material = new THREE.MeshBasicMaterial({ color: color });
    var mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    textGroup.add(mesh);
  }

  // タイトルの描画
  addText("Weather Data 2025 (Hikone)", -150, 320, 0, 20, 0xffffff);

  // X軸ラベル (月) の描画
  for(var i=0; i<labels.length; i++) {
    var x = (barWidth + gap) * i - totalWidth / 2;
    addText(labels[i], x, -30, 0, 10, 0xcccccc);
  }

  // Y軸ラベルを左右に分割
  // 左軸 (降水量)
  for(var j=0; j<=300; j+=50) {
    addText(String(j), -totalWidth/2 - 60, j, 0, 10, 0xcccccc);
  }
  // 右軸 (気温)
  for(var t=0; t<=40; t+=10) {
    var h = t * 7.5;
    addText(String(t), totalWidth/2 + 30, h, 0, 10, 0xcccccc);
  }
  
  // 凡例 (位置を左右の軸上に移動)
  addText("Rain", -totalWidth/2 - 60, 310, 0, 8, 0x88ccff);
  addText("Temp", totalWidth/2 + 30, 310, 0, 8, 0xffaa00);
});
/* ★★★ 新規実装箇所：終了 ★★★ */


function updateVisibility() {
  rainGroup.visible = document.fm.chkRain.checked;
  tempGroup.visible = document.fm.chkTemp.checked;
  textGroup.visible = document.fm.chkText.checked;
}

var mouseX = 0, mouseY = 0;
document.addEventListener("mousemove", (event) => {
  mouseX = event.pageX / window.innerWidth;
  mouseY = event.pageY / window.innerHeight;
});

function draw() {
  requestAnimationFrame( draw );
  var rot = mouseX * 2 * Math.PI + Math.PI;
  var h = mouseY * 1200 - 200; 
  var distance = 650; 
  camera.position.set(Math.sin(rot) * distance, h, Math.cos(rot) * distance);
  camera.lookAt(new THREE.Vector3(0, 100, 0));
  renderer.render( scene, camera );
}
draw();

window.addEventListener('resize', function() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

</script>
</body>
</html>
