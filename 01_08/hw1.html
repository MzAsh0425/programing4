<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>three.js app test</title>
<script src="three.js"></script>
</head>
<body>
<script>
//初期化処理
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera( 70, 1000/500, 0.1, 10000 );
  var renderer = new THREE.WebGLRenderer();
  renderer.setSize(1000, 500 );
  document.body.appendChild( renderer.domElement );
  camera.position.set(2000,0,0); 

  var URL='https://www.gakujutsu.co.jp/text/isbn978-4-7806-0708-6/file/';
  var loader = new THREE.TextureLoader();
  var texture1 = loader.load(URL+'brick.jpg');
  var texture2 = loader.load(URL+'earth.jpg');
  var texture3 = loader.load(URL+'sun.jpg');
  var texture4 = loader.load(URL+'moon.jpg');
    
  var geometry = new THREE.SphereGeometry(300, 32, 32);
  var material = new THREE.MeshStandardMaterial( { map: texture3 } );
  var sun = new THREE.Mesh( geometry, material );
  sun.position.set(500, 0, 0)
  scene.add( sun );

  var sunlight = new THREE.PointLight(0xffaa00, 2, 5000);
  sunlight.position.set(0, 0, 0);
  sun.add( sunlight );

  var geometry2 = new THREE.SphereGeometry(200, 32, 32);
  var material2 = new THREE.MeshStandardMaterial( { map: texture2 } );
  var earth = new THREE.Mesh( geometry2, material2 );
  earth.position.set(0, 1000, 0);
  sun.add( earth );

  var geometry3 = new THREE.SphereGeometry(100, 32, 32);
  var material3 = new THREE.MeshStandardMaterial( { map: texture4 } );
  var moon = new THREE.Mesh( geometry3, material3 );
  moon.position.set(0,0,300);
  earth.add( moon );

  var light3 = new THREE.AmbientLight(0xFFFFFF, 1.0);
  scene.add(light3);

  var g_geometry = new THREE.BoxGeometry(500, 0.1, 500);
  var g_material = new THREE.MeshStandardMaterial({ color: 0x808080 });
  for ( var x = -30 ; x<30 ; x++ ) {
  for ( var y = -20 ; y<20 ; y++ ) {
  var u=x*2;
  var v=y;
  if (y & 1) {u+=1};
  var ground = new THREE.Mesh( g_geometry, g_material );
  ground.position.set(u*500, -2000, v*500);
  scene.add( ground );
  var ground = new THREE.Mesh( g_geometry, g_material );
  ground.position.set(u*500, 2000, v*500);
  scene.add( ground );
  }
  }

  var mouseX = 0;
  var mouseY = 0;
  document.addEventListener("mousemove", (event) => {
  mouseX = event.pageX / window.innerWidth;
  mouseY = event.pageY / window.innerHeight;
  });
    
  var theta=0;
  function draw() {
    requestAnimationFrame( draw );
    theta += 0.03;
    sun.position.x = 500*Math.cos( theta );
    sun.position.z = 500*Math.sin( theta );
    earth.position.x = 1000*Math.cos( theta * 2 );
    earth.position.z = 1000*Math.sin( theta * 2 );
    moon.position.x = 300*Math.cos( theta * 3 );
    moon.position.z = 300*Math.sin( theta * 3 );
    var rot = mouseX * 2 * Math.PI;
    var h = mouseY * 2000 - 1000;
    camera.position.set(Math.sin(rot)*2000, h, Math.cos(rot)*2000);
    camera.lookAt(new THREE.Vector3(0, 0, 0));
    renderer.render( scene, camera );
  }
  draw();
</script>
</body>
</html>
