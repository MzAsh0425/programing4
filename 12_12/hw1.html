<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Java scriptのテスト</title>
<script>
function line( ctx, x1, y1, x2, y2, r, g, b ) {
  ctx.strokeStyle = "rgb("+r+","+g+","+b+")";
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}
function getCSV( file ){
  var req = new XMLHttpRequest( );
  req.open("get", file, false);
  req.send();
  var tmp = req.responseText.split("\n");
  var result = new Array();
  for(var i=0;i<tmp.length;i++){
    result[i] = tmp[i].split(",");
  }
  return result;
}
var result = getCSV( "https://t-sato.digick.jp/lecture/weather.csv" );
function drawWeather() {
  var cvs = document.getElementById("hcnv");
  var ctx = cvs.getContext("2d");
  ctx.clearRect(0, 0, ctx.canvas.clientWidth, ctx.canvas.clientHeight);
  var isHikone = weatherForm.ck[0].checked;
  var isNaha = weatherForm.ck[1].checked;
  var isAbashiri = weatherForm.ck[2].checked;
  var px_h, py_h;
  var px_n, py_n;
  var px_a, py_a;
  var xStep = 2.8; 
  var yZero = 400;
  var yScale = 10;
  for (var i = 2; i < result.length-1; i++) {
    var items = result[i];
    var x = (i - 2) * xStep;
    var tempH = Number(items[1]);
    var tempN = Number(items[5]);
    var tempA = Number(items[9]);
    var y_h = yZero - tempH * yScale;
    var y_n = yZero - tempN * yScale;
    var y_a = yZero - tempA * yScale;
    if (i > 2) {
      if (isHikone) line(ctx, px_h, py_h, x, y_h, 255, 0, 0);
      if (isNaha)   line(ctx, px_n, py_n, x, y_n, 0, 255, 0);
      if (isAbashiri) line(ctx, px_a, py_a, x, y_a, 0, 0, 255);
    }
    px_h = x; py_h = y_h;
    px_n = x; py_n = y_n;
    px_a = x; py_a = y_a;
  }
  drawLegend(ctx);
}

function drawLegend(ctx) {
  ctx.strokeStyle = "rgb(200,200,200)";
  ctx.setLineDash([5, 5]); 
  ctx.beginPath();
  ctx.moveTo(0, 400);
  ctx.lineTo(990, 400);
  ctx.moveTo(0, 300);
  ctx.lineTo(990, 300);
  ctx.moveTo(0, 200);
  ctx.lineTo(990, 200);
  ctx.moveTo(0, 100);
  ctx.lineTo(990, 100);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "black";
  ctx.font = "16px sans-serif";
  ctx.fillText("0°C", 1000, 405);
  ctx.fillText("10°C", 1000, 305);
  ctx.fillText("20°C", 1000, 205);
  ctx.fillText("30°C", 1000, 105);
  ctx.fillStyle = "rgb(240,240,240)";
  ctx.fillRect(0, 0, 100, 80);
  ctx.fillStyle = "red";
  ctx.fillText("ー 彦根", 30, 20);
  ctx.fillStyle = "green";
  ctx.fillText("ー 那覇", 30, 45);
  ctx.fillStyle = "blue";
  ctx.fillText("ー 網走", 30, 70);
}
</script>
</head>
<body>
<form name="weatherForm">
  <input type="checkbox" name="ck" checked> 彦根
  <input type="checkbox" name="ck" checked> 那覇
  <input type="checkbox" name="ck" checked> 網走
  <input type="button" value="描画!" onclick="drawWeather()">
</form>
<canvas id="hcnv" width="1024" height="768"></canvas>
