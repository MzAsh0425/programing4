<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Java scriptのテスト</title>
<script>
function line( ctx, x1, y1, x2, y2, r, g, b ) {
  ctx.strokeStyle = "rgb("+r+","+g+","+b+")";
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}
var mouseX = 0, mouseY = 0, mouseB = 0, pmouseX = 0, pmouseY = 0;
function mouseMove() {
    var cvs = document.getElementById("hcnv");
    var ctx = cvs.getContext("2d");
    var rect = cvs.getBoundingClientRect();
    mouseX = event.pageX - rect.left;
    mouseY = event.pageY - rect.top;
    if (mouseB != 0) {
        line(ctx, pmouseX, pmouseY, mouseX, mouseY, 0, 255, 0);
    }
    pmouseX = mouseX;
    pmouseY = mouseY;
}
</script>
</head>
<body>
<canvas id="hcnv" width="1024" height="768"
 onMousemove="mouseMove()" onMousedown="mouseB=1;" 
 onMouseup="mouseB=0;"></canvas>
</html>
