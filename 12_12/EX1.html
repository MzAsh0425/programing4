<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Java scriptのテスト</title>
<script>
function draw() {
    var cvs = document.getElementById("hcnv");
    var ctx = cvs.getContext("2d");
    ctx.strokeStyle = "rgb(0,0,0)";
    ctx.beginPath();
    ctx.moveTo(0, 0); 
    ctx.lineTo(1024, 0); 
    ctx.lineTo(0, 768); 
    ctx.closePath(); 
    ctx.stroke();
}
</script>
</head>
<body>
<form name="fm">
<input type="button" value="描画!" onclick="draw()">
</form>
<canvas id="hcnv" width="1024" height="768"></canvas></body>
</html>
