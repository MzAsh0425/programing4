<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Java scriptのテスト</title>
<script>
function f01() {
    var total = 0;
    var totalQty = 0;
    var tax = Number(fm.r1.value);

    for (var i = 1; i <= 3; i++) {
      var selectName = "s" + i;
      var priceName  = "t" + i;
      var qtyName    = "t" + (i+3);
      var subTotalName = "t" + (i+6);
      
      var qty = Number(fm[qtyName].value);
      var price = Number(fm[selectName].value) * tax;
      var rowTotal = price * qty;

      fm[priceName].value = Number(fm[selectName].value);
      fm[subTotalName].value = rowTotal;

      total += rowTotal;
      totalQty += qty;
    }
  
    fm.t10.value = totalQty;
    fm.t11.value = total;
}
</script>
</head>
<body>
<form name="fm">
  <table>
    <tr>
      <td>商品名</td>
      <td>税別単価(自動表示)</td>
      <td>個数</td>
      <td>税込合計金額(自動計算)</td>
    </tr>
    <tr>
      <td>
        <select name="s1">
          <option value=100>えんぴつ</option>
          <option value=200>けしごむ</option>
          <option value=300>ノート</option>
        </select>
      </td>
      <td><input type="text" name="t1"><span>円</span></td>
      <td><input type="text" name="t4"><span>個</span></td>
      <td><input type="text" name="t7"><span>円</span></td>
    </tr>
    <tr>
      <td>
        <select name="s2">
          <option value=100>えんぴつ</option>
          <option value=200>けしごむ</option>
          <option value=300>ノート</option>
        </select>
      </td>
      <td><input type="text" name="t2"><span>円</span></td>
      <td><input type="text" name="t5"><span>個</span></td>
      <td><input type="text" name="t8"><span>円</span></td>
    </tr>
    <tr>
      <td>
        <select name="s3">
          <option value=100>えんぴつ</option>
          <option value=200>けしごむ</option>
          <option value=300>ノート</option>
        </select>
      </td>
      <td><input type="text" name="t3"><span>円</span></td>
      <td><input type="text" name="t6"><span>個</span></td>
      <td><input type="text" name="t9"><span>円</span></td>
    </tr>
    <tr>
      <td>合計(自動計算)</td>
      <td></td>
      <td><input type="text" name="t10"><span>個</span></td>
      <td><input type="text" name="t11"><span>円</span></td>
    </tr>
  </table>
  <br>
  <span>税率:</span>
  <input type="radio" value=1.05 name="r1">5%
  <input type="radio" value=1.08 name="r1" checked>8%
  <input type="radio" value=1.10 name="r1">10%
  <input type="button" value="自動計算" name="b1" onClick="f01()">
</form>
